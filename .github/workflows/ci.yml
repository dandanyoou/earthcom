name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:i18n
      - run: pnpm check:responsive-boundary
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter frontend build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend
      - run: docker compose up -d --wait postgres redis
      - run: docker compose run --rm backend ruff check .
      - run: docker compose run --rm backend python -m pytest -q -m "not live"
      - run: docker compose run --rm backend alembic upgrade head
