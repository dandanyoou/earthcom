name: pangaea

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pangaea:pangaea-local-only@postgres:5432/pangaea}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      AI_MODE: ${AI_MODE:-stub}
      DEPOSIT_PROVIDER: ${DEPOSIT_PROVIDER:-sandbox}
      DEPOSIT_PRODUCTION_ENABLED: ${DEPOSIT_PRODUCTION_ENABLED:-false}
      DEPOSIT_FORFEITURE_ENABLED: ${DEPOSIT_FORFEITURE_ENABLED:-false}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-pangaea-local-development-signing-key}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-pangaea-local-development-rate-limit-pepper}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pangaea_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      RUFF_CACHE_DIR: ${RUFF_CACHE_DIR:-/tmp/pangaea/ruff}
      PYTHONPYCACHEPREFIX: ${PYTHONPYCACHEPREFIX:-/tmp/pangaea/pycache}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
      - backend-cache:/tmp/pangaea
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pangaea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pangaea-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pangaea}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pangaea}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pangaea-local-only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  backend-cache:
  postgres-data:
  redis-data:
  minio-data:
